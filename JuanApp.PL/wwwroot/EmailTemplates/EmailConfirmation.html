<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            padding: 25px;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .body {
            padding: 35px 25px;
            color: #333333;
            line-height: 1.7;
            text-align: center;
        }
        .body p {
            margin-bottom: 25px;
            font-size: 16px;
        }
        .highlight {
            color: #2575fc;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            font-size: 16px;
            color: white;
            background-color: #6a11cb;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(106,17,203,0.4);
        }
        .btn:hover {
            background-color: #2575fc;
            box-shadow: 0 6px 16px rgba(37,117,252,0.5);
        }
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #999999;
            background-color: #f4f6f8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        Welcome to Our Service!
    </div>
    <div class="body">
        <p>Hi <span class="highlight">{{UserName}}</span>,</p>
        <p>Thank you for signing up! To complete your registration, please confirm your email by clicking the button below:</p>
        <a href="{{ConfirmationLink}}" class="btn">Confirm My Email</a>
        <p>If you didn’t sign up for an account, you can safely ignore this email.</p>
    </div>
    <div class="footer">
        &copy; 2025 YourCompany. All rights reserved.
    </div>
</div>
</body>
</html>
