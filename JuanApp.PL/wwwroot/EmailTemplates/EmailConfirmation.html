<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmation</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 2px solid #DAA841;
        }
        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #DAA841;
            padding: 30px 25px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1.5px;
            border-bottom: 3px solid #DAA841;
        }
        .logo {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }
        .body {
            padding: 35px 25px;
            color: #333333;
            line-height: 1.7;
            text-align: center;
        }
        .body p {
            margin-bottom: 25px;
            font-size: 16px;
        }
        .highlight {
            color: #DAA841;
            font-weight: 700;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            font-size: 16px;
            color: #1a1a1a;
            background: linear-gradient(135deg, #DAA841 0%, #c99a3a 100%);
            text-decoration: none;
            border-radius: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(218, 168, 65, 0.3);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: linear-gradient(135deg, #c99a3a 0%, #DAA841 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(218, 168, 65, 0.4);
        }
        .footer {
            text-align: center;
            padding: 25px;
            font-size: 13px;
            color: #DAA841;
            background-color: #1a1a1a;
            border-top: 3px solid #DAA841;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="http://localhost:5195/assets/img/logo/logo.png" alt="Juan Logo" class="logo" />
        <div>Welcome to Juan!</div>
    </div>
    <div class="body">
        <p>Hi <span class="highlight">{{UserName}}</span>,</p>
        <p>Thank you for signing up! To complete your registration, please confirm your email by clicking the button below:</p>
        <a href="{{ConfirmationLink}}" class="btn">Confirm My Email</a>
        <p style="margin-top: 30px;">If you didn't sign up for an account, you can safely ignore this email.</p>
    </div>
    <div class="footer">
        &copy; 2025 Juan E-commerce. All rights reserved.
    </div>
</div>
</body>
</html>
